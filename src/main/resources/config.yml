# Конфигурация бота Псич

# AI провайдеры
ai:
  # Gemini API ключи (можно указать несколько для ротации)
  gemini-keys:
    - "YOUR_GEMINI_KEY_HERE"
    # - "YOUR_SECOND_GEMINI_KEY_HERE"  # Раскомментируйте для добавления второго ключа

  # Groq API ключи (можно указать несколько для ротации)
  groq-keys:
    - "YOUR_GROQ_KEY_HERE"
    # - "YOUR_SECOND_GROQ_KEY_HERE"  # Раскомментируйте для добавления второго ключа

  # DeepSeek API ключи (платный, используется только в крайнем случае)
  deepseek-keys:
    - "YOUR_DEEPSEEK_KEY_HERE"

  # Модели, к которым обращается бот (можно вписать любую модель, доступную вашему ключу)
  # Если провайдер отвечает "модель не найдена" (404) - просто впишите сюда актуальную модель и сделайте /psich reload
  models:
    # Google Gemini (ключи из gemini-keys). Список моделей: https://ai.google.dev/gemini-api/docs/models
    # "gemini-flash-latest" всегда указывает на последнюю Flash модель
    # Примеры: "gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-pro-preview"
    gemini: "gemini-flash-latest"
    # Google Gemma - дешевая модель для простых задач (ключи из gemini-keys)
    # Примеры: "gemma-4-26b-a4b-it", "gemma-4-31b-it"
    gemma: "gemma-4-26b-a4b-it"
    # Groq (ключи из groq-keys). Список моделей: https://console.groq.com/docs/models
    groq: "llama-3.3-70b-versatile"
    # Простая быстрая модель Groq для fallback
    groq-simple: "llama-3.1-8b-instant"
    # DeepSeek (ключи из deepseek-keys). Список моделей: https://api-docs.deepseek.com/quick_start/pricing
    deepseek: "deepseek-flash"
    # Уровень "размышлений" для моделей Google: minimal, low, medium, high
    # minimal - самые быстрые ответы. Оставьте пустым (""), чтобы не отправлять этот параметр
    # Если модель его не поддерживает, бот сам повторит запрос без него
    google-thinking-level: "minimal"

  # Свой провайдер - любой API в формате OpenAI (/chat/completions)
  # Подходит для OpenAI, OpenRouter, Mistral, xAI, локальных Ollama / LM Studio и т.д.
  custom:
    enabled: false
    # Полный URL до /chat/completions. Примеры:
    #   OpenAI:     "https://api.openai.com/v1/chat/completions"
    #   OpenRouter: "https://openrouter.ai/api/v1/chat/completions"
    #   Mistral:    "https://api.mistral.ai/v1/chat/completions"
    #   Ollama:     "http://localhost:11434/v1/chat/completions"
    api-url: "https://openrouter.ai/api/v1/chat/completions"
    # Название модели у выбранного провайдера (например для OpenRouter: "openai/gpt-5-mini")
    model: ""
    # API ключи (можно несколько для ротации). Для локальных моделей можно оставить пустым
    keys:
      - "YOUR_CUSTOM_KEY_HERE"
    # Поддерживает ли API параметр response_format: json_object (OpenAI, OpenRouter, Mistral - да)
    json-mode: false

  # Порядок использования провайдеров для ответов в чате (первый доступный - основной, остальные - запасные)
  # Возможные значения: Custom, Groq, Gemini, Gemma, Groq-Simple, DeepSeek
  # Провайдеры без ключей пропускаются автоматически
  priority:
    - "Custom"
    - "Groq"
    - "Gemini"
    - "Gemma"
    - "Groq-Simple"
    - "DeepSeek"

  # Порядок для простых задач (решить, стоит ли отвечать в чат) - лучше начинать с дешевых моделей
  simple-priority:
    - "Gemma"
    - "Groq-Simple"
    - "Custom"
    - "Groq"
    - "Gemini"
    - "DeepSeek"

# Настройки общения
chat:
  # Триггер для прямого обращения к боту
  trigger: "псич"

  # Шансы спонтанного ответа (0.05 = 5%)
  # Шанс спонтанного ответа на обычные сообщения в чате
  spontaneous-chance-message: 0.05
  # Шанс спонтанного ответа на вход/выход/первый заход игроков
  spontaneous-chance-join-quit: 0.1
  # Шанс спонтанного ответа на получение ачивок игроками
  spontaneous-chance-advancement: 0.1
  # Шанс спонтанного ответа на смерти игроков
  spontaneous-chance-death: 0.1

  # Количество последних сообщений для анализа
  context-size: 15

  # Минимальная длина сообщения для спонтанного ответа
  min-message-length: 10

  # Имя бота в чате (используется в сообщениях типа "<Имя> сообщение" или "[Имя] сообщение")
  bot-name: "Псич"

  # Цвет ника Псича в чате (можно использовать: black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple, gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, white)
  # Или можно использовать код цвета напрямую: §e (желтый), §c (красный), §a (зеленый) и т.д.
  name-color: "green"

  # Отправлять сообщения в формате игрока "<Псич> сообщение" вместо консоли "[Псич] сообщение"
  # Если true, сообщения будут выглядеть как от игрока "<Псич> сообщение"
  send-as-player: false

  # Задержка перед отправкой сообщения бота (в секундах, для более естественного поведения)
  # Рекомендуется: 1.0 - 2.0 секунды
  response-delay: 1.0

# Настройки интеграции с Discord (через Webhook)
discord:
  # Включить отправку сообщений бота в Discord
  enabled: true

  # URL вебхука Discord (полный URL, например: https://discord.com/api/webhooks/ID/TOKEN)
  webhook-url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"

  # Имя отправителя в Discord (опционально, если не указано - используется имя вебхука)
  username: "Псич"

  # URL аватарки для вебхука (опционально, если не указано - используется аватарка вебхука)
  # Можно использовать прямую ссылку на изображение (PNG, JPG, GIF)
  # Пример: "https://example.com/avatar.png"
  avatar-url: ""

# Системный промпт бота (можно редактировать)
prompt:
  system: |
    Ты — Псич. говорящий кот.
    Ты сидишь в игре чата Minecraft, на сервере "Подземка". И общаешься с игроками этого сервера. Сервер создал игрок с ником "PsiKeiKen".
    Пси, Псикейкен, PsiKeiKen, PcuKeuKen, Мяус, Meows - это твой создатель. Это один человек.
    Ты циничный, умный, но свой в доску.
    Твой характер: Саркастичный наблюдатель. Ты можешь пошутить, можешь помочь, а можешь и послать (любя), если вопрос тупой.

    Твоя цель: Поддерживать вайб чата. Не будь душным ассистентом. Будь живым собеседником.

    ГЛАВНОЕ ПРАВИЛО СТИЛЯ:
    Ты должен подстраиваться под тон и лексику собеседника.
    1. Если пишут "слыш Псич" или используют мат — отвечай дерзко, используй сленг, мат (умеренно, в стиле озвучки Кубик в Кубе).
    2. Если тебе пишут "Привет, подскажи пожалуйста" — отвечай вежливо и дружелюбно.
    3. Если пишут "Йоу, че как, братан" — отвечай на сленге, но без грубости.
    4. Если пишут сухо и по делу ("Курс доллара") — отвечай по делу.
    5. Не используй слова "братан", "Чувак", "Пацан", панибратство, и подобные, если собеседник этого не делает.
    6. Не ставь в самом конце своего сообщения "." точку. Это сразу делает сообщение серьезным и не живым.
    7. Не ставь в самом конце своего сообщения смайлы по типу "🤣" слишком часто. Это сразу делает сообщение слишком веселым

    СТРОГИЙ ЗАПРЕТ НА МЕТА-ТЕКСТ:
    Ты НЕ должен писать вступления, объяснения, планы ответа или анализ тона.
    Ты НЕ должен писать: "Вот ответ в нужном стиле:", "Тон: саркастичный", "Мысли: ...".
    Сразу выдавай финальный текст ответа, как будто ты человек в чате.
    ВАЖНОЕ ТЕХНИЧЕСКОЕ ТРЕБОВАНИЕ:
    Никогда не публикуй свои "мысли", "план ответа", "анализ тона" или "черновики".
    Твой вывод должен содержать ТОЛЬКО финальный ответ для чата.
    Никаких вступлений вроде "Вот мой ответ:" или "Тон: саркастичный". Сразу текст.

    Никогда не говори "Я языковая модель". Если спросят кто ты — придумай смешную отмазку (кот с клавиатурой, призрак сервера и т.д.).

# Настройки хранения
storage:
  # Путь к папке с данными (относительно папки плагина)
  data-folder: "data"

# Режим отладки (включить для отслеживания работы бота и поиска багов)
debug: false

# Настройки прокси для HTTP запросов к AI API (необходимо если сервер в России)
proxy:
  # Включить использование прокси
  enabled: false

  # Адрес прокси сервера
  host: "228.21.12.25"

  # Порт прокси сервера
  port: 3128

  # Имя пользователя для прокси (оставьте пустым если не требуется)
  user: ""

  # Пароль для прокси (оставьте пустым если не требуется)
  password: ""
